id: testable_vs_not
title: "TESTABLE VS NOT_TESTABLE"
columns: [gap_type, evidence, decision, category_or_note]
when_any_tags: []
rows:
  - gap_type: "Missed line"
    evidence: "Public unit-testable path exists (incl. Robolectric for Android APIs)"
    decision: "testable"
    category_or_note: "—"
  - gap_type: "Missed line"
    evidence: "Only path needs real HTTP, sensors, non-unit I/O, or unavailable seam"
    decision: "not_testable"
    category_or_note: "Concrete reason required"
  - gap_type: "Missed / partial"
    evidence: "Only sibling *JvmTest / *RobolectricTest evidence"
    decision: "Still plan against PIPELINE TARGET *Test.kt"
    category_or_note: "Sibling is not enough for residual"
  - gap_type: "Heavy real construction / unsupported API"
    evidence: "Stub/mock/Robolectric seam available"
    decision: "testable with stub fixture_hint"
    category_or_note: "Do not defer solely for heavy construction"
  - gap_type: "Private-only gap"
    evidence: "No reachable public entry point (lifecycle / public API) covers the private method with verified stubs"
    decision: "not_testable"
    category_or_note: "private_no_public_entry — never plan private Act, reflection, or spy-on-private"
  - gap_type: "Private method on delta"
    evidence: "A selected public lifecycle/API path reaches it through deterministic verified setup"
    decision: "testable via that public Act only"
    category_or_note: "methods: lists the public entry; private name is not an Act target"
  - gap_type: "Empty testable and empty not_testable"
    evidence: "Any remaining delta lines"
    decision: "Treated as all deferred — always fill not_testable"
    category_or_note: "Do not omit delta lines"
