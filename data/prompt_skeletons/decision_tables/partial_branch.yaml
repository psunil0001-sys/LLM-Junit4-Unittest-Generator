id: partial_branch
title: "PARTIAL BRANCH / SHORT-CIRCUIT"
columns: [situation, do, do_not]
when_any_tags: []
rows:
  - situation: "Missed line (never executed)"
    do: "Plan a public path that reaches it"
    do_not: "Attribute to adjacent lines outside allow-list"
  - situation: "PARTIAL BRANCH (mb>0); line already ran"
    do: "Attribute probes to the partial-branch line number(s) in the allow-list; plan uncovered branch probes only"
    do_not: "Re-enter the already-covered arm (another both-true / happy-path)"
  - situation: "a && b missing combinations"
    do: "Name missing truth combo in approach/fixture_hint: a=false; a=true&&b=false; a=true&&b=true only if body still needed"
    do_not: "Use reflection to force short-circuit arms"
  - situation: "a OR b missing combinations"
    do: "Name combo: a=true; a=false&&b=true; a=false&&b=false as needed"
    do_not: "Invent complementary-arm TCs when TARGET already covers all arms"
  - situation: "Android checkSelfPermission pairs"
    do: "Robolectric grant/deny each flag independently via public inputs"
    do_not: "Reflection on permission state"
  - situation: "Partial-only delta; TARGET already drives all logical arms"
    do: "not_testable category kover_residual_branch with reason naming TARGET tests — only PIPELINE TARGET *Test.kt evidence can justify category kover_residual_branch"
    do_not: "Plan another complementary-arm test; cite sibling *JvmTest as residual proof"
  - situation: "No unit-testable input can flip the probe"
    do: "not_testable with concrete reason"
    do_not: "Force probe via unverified seams"
  - situation: "Gap is private-only; no public entry reaches it"
    do: "not_testable with category private_no_public_entry (or concrete equivalent)"
    do_not: "Plan private Act, reflection, or spy on private methods"
