rules:
  - when:
      source_any: ['@AndroidEntryPoint', '@Inject', '@HiltWorker']
      test_not: '@HiltAndroidTest'
    message: "instrumented_missing_hilt_annotation: Hilt CUT androidTests require @HiltAndroidTest on the test class."

  - when:
      test: '@HiltAndroidTest'
      test_not: 'HiltAndroidRule'
    message: "instrumented_missing_hilt_rule: Add @get:Rule val hiltRule = HiltAndroidRule(this) and call hiltRule.inject() in @Before."

  - when:
      test_contains_any: ['RobolectricTestRunner', 'ActivityController<', 'Robolectric.buildActivity']
    message: "instrumented_forbidden_robolectric_pattern: Robolectric runners, @Config shadows, and ActivityController belong in src/test only."

  - when:
      test_contains: '@Config('
    message: "instrumented_forbidden_robolectric_pattern: Robolectric @Config belongs in src/test only."

  - when:
      test: '@Test'
      test_not_contains: 'AndroidJUnit4'
    message: "instrumented_missing_android_junit4: androidTest classes with @Test must use @RunWith(AndroidJUnit4::class)."

  - when:
      test_contains_any: ['launchFragmentInContainer', 'FragmentScenario.launchInContainer', 'launchInContainer(']
      test_not_contains_any: ['commitNow', 'HiltNavTestActivity']
    message: "instrumented_bad_fragment_launch: use ActivityScenario.launch(HiltTestActivity) + commitNow or HiltNavTestActivity for NavHost; never launchInContainer."

  - when:
      test_contains: 'onAttach(mock<'
    message: "instrumented_invalid_on_attach: do not call Fragment.onAttach with mocked delegates; attach via ActivityScenario with a Hilt host and commitNow."

  - when:
      test_contains: 'AuthorizationResponse'
      test_contains_any: ['object : AuthRepository', 'object: AuthRepository']
    message: "instrumented_appauth_stub: use mockk(relaxed=true) or Mockito mock for AuthRepository; do not anonymous-implement AppAuth-typed methods on androidTest classpath."

  - when:
      source_any: ['Fragment', 'DialogFragment']
      test_contains_any: ['fragment._binding', 'fragment.binding', 'fragment.toolbar', 'fragment.mainActivityDelegate']
    message: "instrumented_private_surface_assert: do not assert private fragment fields; use Espresso onView or @BindValue fake flags on test fields."

  - when:
      source_contains: 'findNavController'
      test_contains_any: ['performClick', 'R.id.next', 'R.id.skip']
      test_contains: 'HiltTestActivity'
      test_not_contains: 'HiltNavTestActivity'
    message: "instrumented_nav_host_hint: navigation clicks should launch HiltNavTestActivity (NavHost), not HiltTestActivity + commitNow."

  - when:
      source_contains_any: ['setAnalyticsConsent', 'clearAuthState']
      test_contains: '@BindValue'
      test_not_contains: 'verify {'
    message: "instrumented_bindvalue_verify_hint: assert @Inject collaborator effects with mockk verify { repo.method(...) }, not private fragment fields."
