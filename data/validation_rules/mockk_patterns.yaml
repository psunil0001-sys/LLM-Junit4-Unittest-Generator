rules:
  - when:
      test_contains: io.mockk
      test_any:
        - 'every\s*\{'
      source_any:
        - 'suspend fun'
        - 'suspend ('
      test: 'every\s*\{[^}]*(?:await|suspend|\.invoke)'
      test_not_contains: coEvery
    message: >-
      invalid_mockk_suspend_stub: MockK lane must stub suspend members with coEvery / coVerify,
      not every { } / verify { }.

  # Teardown only when mockkObject(...) is actually invoked (not substring of unmockkObject).
  # Exempt when file-level unmockkAll/clearAllMocks OR an @After method unmocks.
  - when:
      test: '\bmockkObject\s*\('
      test_not: 'unmockkAll|clearAllMocks|@After[\s\S]{0,4000}?\bunmockk(?:Object|All)?\b|\bunmockkObject\s*\('
    message: >-
      invalid_mockk_object_teardown: mockkObject requires unmockkObject / clearAllMocks / unmockkAll
      in an @After method (or file-level unmockkAll/clearAllMocks) so later tests do not leak the object mock.

  - when:
      test: '\bmockkStatic\s*\('
      test_not: 'unmockkAll|clearAllMocks|@After[\s\S]{0,4000}?\bunmockk(?:Static|All)?\b|\bunmockkStatic\s*\('
    message: >-
      invalid_mockk_static_teardown: mockkStatic requires unmockkStatic / clearAllMocks / unmockkAll
      in an @After method (or file-level unmockkAll/clearAllMocks).

  - when:
      test: '\bmockkConstructor\s*\('
      test_not: 'unmockkAll|clearAllMocks|@After[\s\S]{0,4000}?\bunmockk(?:Constructor|All)?\b|\bunmockkConstructor\s*\('
    message: >-
      invalid_mockk_constructor_teardown: mockkConstructor requires unmockkConstructor / clearAllMocks / unmockkAll
      in an @After method (or file-level unmockkAll/clearAllMocks).

  - when:
      test_contains: io.mockk
      test: 'mockkStatic\s*\(\s*[A-Za-z_][A-Za-z0-9_]*::class\.java\s*\)'
    message: >-
      invalid_mockk_static_shape: mockkStatic takes the KClass / string name
      (mockkStatic(Type::class) or mockkStatic("pkg.Type")), not Type::class.java
      (that is Mockito mockStatic).
