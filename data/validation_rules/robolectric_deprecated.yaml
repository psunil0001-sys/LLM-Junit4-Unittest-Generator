rules:
  - when:
      source_any:
        - activeNetwork
        - getNetworkCapabilities
      test_any:
        - '\.setActiveNetworkInfo\s*\(\s*null\s*\)'
        - 'ShadowNetworkInfo.newInstance\('
      test_not: NetworkInfo.DetailedState
    repair: deprecated_robolectric_api

  # Kept intentional Robolectric 3.x removals for major >= 4.
  # Note: getNextStartedActivity() is the supported 4.x API (see repair intent) and is NOT matched here.
  # getNextStartedIntent(s) is the obsolete name we still flag.
  - when:
      test_any:
        - org.robolectric.ShadowDialog
        - flushMainThreadQueue
        - Robolectric.getShadowApplication\(\)
        - '\.getNextStartedIntents?\s*\('
      ctx:
        robolectric_major_at_least_4: true
    repair: deprecated_robolectric_api
